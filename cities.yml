# New York remixes: same Manhattan, new game, platform or engine. Shown on New York's card on the map.
remixes:
  intro: Same Manhattan, new game, platform or engine.
  entries:
    - name: City Life Simulator
      source: https://github.com/desurfofficial-ship-it/slop-newyork
      by: desurfofficial-ship-it
      desc: Subway, money, apartments, jobs and New Yorkers on top of the original.
      flags: [source only]
    - name: Extinction Avenue
      play: https://midagedev.github.io/extinction-avenue/
      source: https://github.com/midagedev/extinction-avenue
      by: midagedev
      desc: Arcade dino-outbreak car shooter in Midtown.
      screenshot: screenshots/new-york-extinction-avenue.jpg
    - name: Flying Car Simulator
      play: https://flyingcarsimulator.io
      tweet: https://x.com/josephzhangai/status/2114743491196850426
      by: "@josephzhangai"
      desc: Fly a Roadster over 1:1 Manhattan with live traffic.
      screenshot: screenshots/new-york-flying-car-simulator.jpg
    - name: "GEN Z QUANT: Unfinished Business"
      play: https://genzquant.com/
      source: https://github.com/ceogenz/gen-z-quant
      by: ceogenz
      desc: "Open-world mission game: drive a rocket-boosted supercar through Manhattan, fight the Degens and get the dog Moon home."
      screenshot: screenshots/new-york-gen-z-quant-unfinished-business.jpg
    - name: Handbrake drift
      source: https://github.com/tiborsaas/slop-newyork
      by: tiborsaas
      desc: Adds a handbrake to the car, with rear-wheel drift.
      flags: [source only]
    - name: LLM residents
      source: https://github.com/trippuroskie/slop-newyork
      by: trippuroskie
      desc: Eight Midtown residents with hunger, work and social needs, whose hourly plans come from one batched LLM call. Needs a local Node server.
      flags: [source only]
    - name: Low-end GPU fork
      play: https://denzy7.github.io/slop-newyork/
      source: https://github.com/Denzy7/slop-newyork
      by: Denzy7
      desc: Performance rewrite for weak GPUs and browsers without WebGPU.
      screenshot: screenshots/new-york-low-end-gpu-fork.jpg
    - name: Make it anywhere
      play: https://makeitanywhere.xyz
      by: "@mattiadmr"
      desc: A live Times Square where you can take over a billboard screen with your own ad (paid, from 1 EUR). Built on the phone mode from Slop New York Mini.
      screenshot: screenshots/new-york-make-it-anywhere.jpg
    - name: "NYC Spin-off: EUC Thrills"
      play: https://vibezzzcoder.github.io/euc-nyc/
      source: https://github.com/VibezZzCoder/euc-nyc
      by: VibezZzCoder
      desc: Ride an electric unicycle through Manhattan with EUC Thrills riding physics while dodging a paddle-wielding cop.
    - name: Pocket New York
      source: https://github.com/pocket-nexus/pocket-newyork
      tweet: https://x.com/pocket_js/status/2113974954131882181
      by: "@pocket_js"
      desc: Slop New York compiled with Pocket3D to run on a PS Vita.
      flags: [WIP]
    - name: Real terrain
      play: https://pablo-mayrgundter.github.io/slop-newyork/?ground=terrain
      source: https://github.com/pablo-mayrgundter/slop-newyork
      by: pablo-mayrgundter
      desc: Drives the city over Manhattan's real ground.
      screenshot: screenshots/new-york-real-terrain.jpg
    - name: Slop New York Mini
      play: https://mattiaongit.github.io/slop-newyork-mini/
      source: https://github.com/mattiaongit/slop-newyork-mini
      by: mattiaongit
      desc: "Runs on an iPhone: Midtown at 60 fps. Desktop gets the original; `?phone` forces phone mode."
      screenshot: screenshots/new-york-slop-new-york-mini.jpg
    - name: Spider-Man · Slop New York
      play: https://jnaranj09.github.io/claude-spiderman-game/
      source: https://github.com/jnaranj09/claude-spiderman-game
      by: jnaranj09
      desc: Web-swing through Manhattan on your phone with a one-thumb swinging controller.
      screenshot: screenshots/new-york-spider-man-slop-new-york.jpg
    - name: Taxi fares
      play: https://mrubens.github.io/new-york/
      source: https://github.com/mrubens/new-york
      by: mrubens
      desc: Drive taxi fares against the clock.
      screenshot: screenshots/new-york-taxi-fares.jpg
    - name: Unity port
      source: https://github.com/jdlp2442/port-slop-newyork
      by: jdlp2442
      desc: "1:1 port to Unity 6 / URP 17."

