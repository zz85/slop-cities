# The data behind the Awesome Slop Cities list and its world map.
# Edit this file, then run   node map/build/build.mjs
# which rewrites the lists in README.md and map/data/cities.json. See CONTRIBUTING.md.

# The original: New York, which every other city descends from.
original:
  city: New York
  country: USA
  region: North America
  coords: [40.758, -73.9855]
  takes:
    - play: https://mrdoob.github.io/slop-newyork/
      pick: true
      source: https://github.com/mrdoob/slop-newyork
      tweet: https://x.com/mrdoob/status/2113177383658561721
      by: "@mrdoob"
      desc: Manhattan on foot, car, bicycle or helicopter.
      screenshot: screenshots/newyork.jpg

# Cities by region; the build lists them alphabetically, and each city's takes in the order given.
cities:
